version: "3.8"

services:
  contacts-api:
    build: .
    container_name: contacts-api
    ports:
      - "8080:8080"           # Expose 8080
    volumes:
      - .:/usr/src/app        # Sync your local code into the container
    working_dir: /usr/src/app
    command: nodemon server.js  # Start with nodemon
    restart: unless-stopped
